name: Update WordPress.org readme and assets

# Manual only: running this right after a version bump would publish a
# Stable tag that has no tags/X.Y.Z folder yet.
on:
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: international-telephone-box
          IGNORE_OTHER_FILES: true
